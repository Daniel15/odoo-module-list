# Redirect to HTTPS
server {
  server_name odoomodules.com www.odoomodules.com;
  listen 80;
  listen [::]:80;
  return 301 https://odoomodules.com/;
}

# Redirect away from www
server {
  server_name www.odoomodules.com;
  listen 443 http2;
  listen [::]:443 http2;
  ssl_certificate /etc/letsencrypt/live/odoomodules.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/odoomodules.com/privkey.pem;
  return 301 https://odoomodules.com/;
}

server {
  server_name odoomodules.com;
  listen 443 http2;
  listen [::]:443 http2;
  ssl_certificate /etc/letsencrypt/live/odoomodules.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/odoomodules.com/privkey.pem;

  root /var/www/odoomodules/;
  index index.html;

  location /_build {
    expires max;
  }

  # Plausible logging
  location = /event {
    proxy_pass https://hits.d.sb/api/event;
    proxy_set_header Host hits.d.sb;
    proxy_buffering on;
    proxy_http_version 1.1;

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}
